services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-obriy}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-obriy}
    ports: ["8000:8000"]
    depends_on: [db]
    develop:
      watch:
        - action: sync
          path: services/api/src
          target: /app/services/api/src
        - action: sync
          path: packages/contracts/src
          target: /app/packages/contracts/src
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: services/api/pyproject.toml
        - action: rebuild
          path: packages/contracts/pyproject.toml

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    init: true
    depends_on: [api]
    develop:
      watch:
        - action: sync
          path: frontend
          target: /app
          ignore: [node_modules/]
        - action: rebuild
          path: frontend/pnpm-lock.yaml
        - action: rebuild
          path: frontend/package.json

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obriy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-obriy}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:

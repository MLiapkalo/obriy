[project]
name = "obriy-contracts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

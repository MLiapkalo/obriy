[tool.uv]
# Single source for the uv version: enforced locally, read by setup-uv in CI.
# Keep services/api/Dockerfile in sync.
required-version = "==0.12.24"

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
src = ["services/*/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
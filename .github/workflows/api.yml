name: api
permissions:
  contents: read
on:
  pull_request:
    paths: &paths
      - services/api/**
      - pyproject.toml
      - uv.lock
      - justfile
      - .github/workflows/api.yml
  push:
    branches: [main]
    paths: *paths
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # no `version:` - setup-uv reads [tool.uv] required-version from pyproject.toml
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0" # same as local
      - run: just api-check
